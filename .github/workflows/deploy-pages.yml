name: Deploy CHSC (free public site)

on:
  push:
    branches: [main, master, phase1-verify-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build static frontend
        # No repository variable set → the site runs the clearly-labelled DEMO
        # engine and can never go black. Set RENDER_API_URL (a repo variable)
        # to your backend URL to make this a strict-live production build: it
        # uses LIVE mode and never substitutes simulated data if the API fails.
        env:
          VITE_API_BASE: ${{ vars.RENDER_API_URL }}
        run: npm run build
        working-directory: frontend

      - name: Publish to gh-pages branch
        # GitHub Pages serves this branch. Publishing it here means no manual
        # "Source: GitHub Actions" switch is required and the built-in Pages
        # workflow deploys the new commit automatically.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: built CHSC static site"

      - name: Show public URL
        run: echo "https://adityadubeyyy87-droid.github.io/CHCS/"
